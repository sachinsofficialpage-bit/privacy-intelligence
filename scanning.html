<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scanning | Privacy Intelligence</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            <span>◈</span>
            Privacy Intelligence
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="scan.html">Scan</a>
            <a href="#">About</a>
        </nav>

    </header>


    <main class="scanning-page">

        <div class="badge">
            PRIVACY ANALYSIS
        </div>

        <div class="scanning-symbol">

            <div class="scan-ring"></div>

            <div class="scan-center" id="scanCenter">
                <span id="scanIcon">◈</span>
</div>

        </div>

        <h1>
            Analyzing your
            <span>document.</span>
        </h1>

        <p>
            Searching for sensitive information
            and potential privacy exposures.
        </p>

        <div class="progress-container">

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="progress-info">

                <span>
                    Detecting sensitive information
                </span>

                <span>
                    SCANNING
                </span>

            </div>

        </div>

        <div class="scan-items">

            <div class="scan-item">
                <span class="check">✓</span>
                Document structure
            </div>

            <div class="scan-item">
                <span class="check">✓</span>
                Sensitive data patterns
            </div>

            <div class="scan-item">
                <span class="check">✓</span>
                Privacy exposure
            </div>

        </div>

    </main>

    <script src="js/main.js"></script>

</body>

</html>
